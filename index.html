<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema IDS - Detección de Anomalías</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.5.0/umd/Recharts.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        #error-container {
            color: orange;
            font-size: 16px;
            margin: 12px;
            min-height: 120px;
            overflow-y: auto;
            border: 1px solid orange;
            padding: 10px;
            border-radius: 8px;
            background-color: #ff96000d;
            display: none;
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="error-container"></div>
    
    <script type="text/babel">
        function App() {
          const [alerts, setAlerts] = React.useState([
            { id: 1, time: '14:23:45', severity: 'high', type: 'DDoS Attack', ip: '192.168.1.45', status: 'active' },
            { id: 2, time: '14:21:12', severity: 'medium', type: 'Port Scanning', ip: '10.0.0.123', status: 'investigating' },
            { id: 3, time: '14:18:33', severity: 'low', type: 'Unusual Traffic', ip: '172.16.0.88', status: 'resolved' },
          ]);

          const [stats, setStats] = React.useState({
            totalPackets: 1247893,
            anomaliesDetected: 47,
            blockedThreats: 12,
            activeConnections: 3421
          });

          const trafficData = [
            { time: '14:15', normal: 850, anomalous: 12 },
            { time: '14:16', normal: 920, anomalous: 8 },
            { time: '14:17', normal: 780, anomalous: 15 },
            { time: '14:18', normal: 890, anomalous: 23 },
            { time: '14:19', normal: 950, anomalous: 18 },
            { time: '14:20', normal: 820, anomalous: 31 },
            { time: '14:21', normal: 880, anomalous: 28 },
            { time: '14:22', normal: 910, anomalous: 19 },
            { time: '14:23', normal: 760, anomalous: 42 },
          ];

          const anomalyTypes = [
            { name: 'DDoS', value: 35, color: '#ef4444' },
            { name: 'Port Scan', value: 25, color: '#f97316' },
            { name: 'Brute Force', value: 20, color: '#eab308' },
            { name: 'Data Exfil', value: 12, color: '#3b82f6' },
            { name: 'Otros', value: 8, color: '#6b7280' },
          ];

          const { LineChart, Line, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

          const getSeverityColor = (severity) => {
            switch(severity) {
              case 'high': return 'bg-red-100 text-red-800 border-red-300';
              case 'medium': return 'bg-orange-100 text-orange-800 border-orange-300';
              case 'low': return 'bg-yellow-100 text-yellow-800 border-yellow-300';
              default: return 'bg-gray-100 text-gray-800 border-gray-300';
            }
          };

          const getStatusColor = (status) => {
            switch(status) {
              case 'active': return 'bg-red-500';
              case 'investigating': return 'bg-orange-500';
              case 'resolved': return 'bg-green-500';
              default: return 'bg-gray-500';
            }
          };

          return (
            <div className="min-h-screen bg-gray-900 text-white p-6">
              {/* Header */}
              <div className="mb-8">
                <div className="flex items-center justify-between">
                  <div>
                    <h1 className="text-3xl font-bold mb-2">Sistema IDS - Detección de Anomalías</h1>
                    <p className="text-gray-400">Monitoreo en tiempo real con IA No Supervisada</p>
                  </div>
                  <div className="flex items-center space-x-4">
                    <div className="flex items-center space-x-2">
                      <div className="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                      <span className="text-sm text-gray-300">Sistema Activo</span>
                    </div>
                    <div className="text-sm text-gray-400">
                      {new Date().toLocaleString('es-ES')}
                    </div>
                  </div>
                </div>
              </div>

              {/* Stats Cards */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-gray-400 text-sm mb-1">Paquetes Analizados</p>
                      <p className="text-3xl font-bold">{stats.totalPackets.toLocaleString()}</p>
                    </div>
                    <div className="bg-blue-500 bg-opacity-20 p-3 rounded-lg">
                      <span className="text-blue-400 text-3xl">📊</span>
                    </div>
                  </div>
                </div>

                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-gray-400 text-sm mb-1">Anomalías Detectadas</p>
                      <p className="text-3xl font-bold text-orange-400">{stats.anomaliesDetected}</p>
                    </div>
                    <div className="bg-orange-500 bg-opacity-20 p-3 rounded-lg">
                      <span className="text-orange-400 text-3xl">⚠️</span>
                    </div>
                  </div>
                </div>

                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-gray-400 text-sm mb-1">Amenazas Bloqueadas</p>
                      <p className="text-3xl font-bold text-red-400">{stats.blockedThreats}</p>
                    </div>
                    <div className="bg-red-500 bg-opacity-20 p-3 rounded-lg">
                      <span className="text-red-400 text-3xl">🛡️</span>
                    </div>
                  </div>
                </div>

                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-gray-400 text-sm mb-1">Conexiones Activas</p>
                      <p className="text-3xl font-bold text-green-400">{stats.activeConnections.toLocaleString()}</p>
                    </div>
                    <div className="bg-green-500 bg-opacity-20 p-3 rounded-lg">
                      <span className="text-green-400 text-3xl">🔌</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Charts Section */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                {/* Traffic Chart */}
                <div className="lg:col-span-2 bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h2 className="text-xl font-semibold mb-4">📈 Tráfico de Red - Últimos 10 minutos</h2>
                  <ResponsiveContainer width="100%" height={300}>
                    <LineChart data={trafficData}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#374151" />
                      <XAxis dataKey="time" stroke="#9ca3af" />
                      <YAxis stroke="#9ca3af" />
                      <Tooltip 
                        contentStyle={{ backgroundColor: '#1f2937', border: '1px solid #374151', borderRadius: '8px' }}
                        labelStyle={{ color: '#fff' }}
                      />
                      <Legend />
                      <Line type="monotone" dataKey="normal" stroke="#10b981" strokeWidth={2} name="Tráfico Normal" />
                      <Line type="monotone" dataKey="anomalous" stroke="#ef4444" strokeWidth={2} name="Anomalías" />
                    </LineChart>
                  </ResponsiveContainer>
                </div>

                {/* Anomaly Types Pie Chart */}
                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h2 className="text-xl font-semibold mb-4">🎯 Tipos de Anomalías</h2>
                  <ResponsiveContainer width="100%" height={300}>
                    <PieChart>
                      <Pie
                        data={anomalyTypes}
                        cx="50%"
                        cy="50%"
                        labelLine={false}
                        label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}
                        outerRadius={80}
                        fill="#8884d8"
                        dataKey="value"
                      >
                        {anomalyTypes.map((entry, index) => (
                          <Cell key={index} fill={entry.color} />
                        ))}
                      </Pie>
                      <Tooltip 
                        contentStyle={{ backgroundColor: '#1f2937', border: '1px solid #374151', borderRadius: '8px' }}
                      />
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Alerts Table */}
              <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-xl font-semibold">🚨 Alertas Recientes</h2>
                  <button className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                    Ver Todas
                  </button>
                </div>
                
                <div className="overflow-x-auto">
                  <table className="w-full">
                    <thead>
                      <tr className="border-b border-gray-700">
                        <th className="text-left py-3 px-4 text-gray-400 font-medium">Hora</th>
                        <th className="text-left py-3 px-4 text-gray-400 font-medium">Tipo de Amenaza</th>
                        <th className="text-left py-3 px-4 text-gray-400 font-medium">IP Origen</th>
                        <th className="text-left py-3 px-4 text-gray-400 font-medium">Severidad</th>
                        <th className="text-left py-3 px-4 text-gray-400 font-medium">Estado</th>
                        <th className="text-left py-3 px-4 text-gray-400 font-medium">Acciones</th>
                      </tr>
                    </thead>
                    <tbody>
                      {alerts.map((alert) => (
                        <tr key={alert.id} className="border-b border-gray-700 hover:bg-gray-750">
                          <td className="py-4 px-4 text-sm">{alert.time}</td>
                          <td className="py-4 px-4 text-sm font-medium">{alert.type}</td>
                          <td className="py-4 px-4 text-sm font-mono">{alert.ip}</td>
                          <td className="py-4 px-4">
                            <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${getSeverityColor(alert.severity)}`}>
                              {alert.severity.toUpperCase()}
                            </span>
                          </td>
                          <td className="py-4 px-4">
                            <div className="flex items-center space-x-2">
                              <div className={`w-2 h-2 rounded-full ${getStatusColor(alert.status)}`}></div>
                              <span className="text-sm capitalize">{alert.status}</span>
                            </div>
                          </td>
                          <td className="py-4 px-4">
                            <button className="text-blue-400 hover:text-blue-300 text-sm font-medium">
                              Detalles →
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* ML Model Info */}
              <div className="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h3 className="text-lg font-semibold mb-3">🤖 Modelo IA</h3>
                  <div className="space-y-2 text-sm">
                    <div className="flex justify-between">
                      <span className="text-gray-400">Algoritmo:</span>
                      <span className="font-medium">Isolation Forest</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Precisión:</span>
                      <span className="font-medium text-green-400">94.7%</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Última actualización:</span>
                      <span className="font-medium">Hace 2h</span>
                    </div>
                  </div>
                </div>

                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h3 className="text-lg font-semibold mb-3">⚡ Rendimiento</h3>
                  <div className="space-y-2 text-sm">
                    <div className="flex justify-between">
                      <span className="text-gray-400">CPU:</span>
                      <span className="font-medium">42%</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Memoria:</span>
                      <span className="font-medium">68%</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Latencia:</span>
                      <span className="font-medium text-green-400">12ms</span>
                    </div>
                  </div>
                </div>

                <div className="bg-gray-800 rounded-lg p-6 border border-gray-700">
                  <h3 className="text-lg font-semibold mb-3">⚙️ Configuración</h3>
                  <div className="space-y-2 text-sm">
                    <div className="flex justify-between">
                      <span className="text-gray-400">Umbral anomalía:</span>
                      <span className="font-medium">0.75</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Auto-bloqueo:</span>
                      <span className="font-medium text-green-400">Activo</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Modo:</span>
                      <span className="font-medium">Producción</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        try {
            ReactDOM.render(<App />, document.getElementById('root'));
        } catch(error) {
            displayError('An error occurred while loading the application.');
        }

        window.addEventListener('error', function(event) {
            displayError(event.message, event.error?.stack);
        });

        function displayError(message, stackInfo) {
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.createElement('div');
            errorMessage.textContent = message;
            errorContainer.appendChild(errorMessage);
            if(stackInfo) {
                const stackErrorMessage = document.createElement('pre');
                stackErrorMessage.textContent = stackInfo.substring(0, 130);
                errorContainer.appendChild(stackErrorMessage);
            }
            errorContainer.style.display = 'block';
        }
    </script>
</body>
</html>
